[project]
name = "basic-agent-langchain"
version = "0.1.0"
description = "The same calculator agent as example 01, using LangChain's chat-model interface + @tool but a hand-written loop — no LangGraph. Local Ollama by default, or Claude."
requires-python = ">=3.10"
dependencies = [
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.2.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false
