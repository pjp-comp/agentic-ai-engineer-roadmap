[project]
name = "web-agent-langgraph-tavily"
version = "0.1.0"
description = "The same company-news research agent as 01_web_agent_langgraph, using Tavily (a client-side tool) instead of Claude's server-side web_search."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-tavily>=0.1.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false
