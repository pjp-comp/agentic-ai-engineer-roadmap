[project]
name = "llm-fundamentals"
version = "0.1.0"
description = "Not an agent — raw sampling parameter (temperature/top-p/top-k), tokenization, and thinking-mode demonstrations against a local Ollama model, no tools, no loop."
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.6.2",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false
