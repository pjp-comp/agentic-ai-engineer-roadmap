[project]
name = "multimodal-rag-agent"
version = "0.1.0"
description = "Agentic, multimodal RAG over real PDFs (text + tables + images), split into one file per pipeline stage (chunking, vision/summarization, embeddings, vector_store, keyword_search, retrieval, generation, pipeline). Multi-vector retrieval: per-element summaries embedded for search, raw content preserved for generation. Hybrid retrieval (vector + BM25 keyword search, fused via Reciprocal Rank Fusion) available via --hybrid. Persistent Session/Event tracking across turns. Ollama only, including a local vision model for image understanding. PDFs go in assets/ -- bring your own."
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-chroma>=0.2.0",
    "ollama>=0.4.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# Only needed if embeddings.py's USE_CLIP is set True -- several GB of
# PyTorch, not installed by default. See embeddings.py's module
# docstring for why CLIP is opt-in, not the default embedding strategy.
clip = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "pillow>=10.0.0",
]

[tool.uv]
package = false
